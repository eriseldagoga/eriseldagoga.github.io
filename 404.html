<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0e14">
    <title>Page not found · Eriselda's Website</title>
    <!-- GitHub Pages serves this page for any missing path, so every URL here must be absolute. -->
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;700&family=Playwrite+GB+J:ital,wght@0,100..400;1,100..400&display=swap"
        rel="stylesheet">

    <!-- Same as index.html: apply the saved theme before first paint -->
    <script>
        (function () {
            let theme = 'auto';
            try { theme = localStorage.getItem('theme-preference') || 'auto'; } catch { }
            if (theme === 'light' || theme === 'dark') {
                document.documentElement.setAttribute('data-theme', theme);
            }
            const isDark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.remove());
            const meta = document.createElement('meta');
            meta.name = 'theme-color';
            meta.content = isDark ? '#0c0e14' : '#ffffff';
            document.head.appendChild(meta);
        })();
    </script>

    <link rel="stylesheet" href="/css/styles.css">
    <style>
        /* One line even for "wrong turn?", which would wrap on phones at the
           index's size (18vw) and run its descenders into the line below. */
        #notfound-greeting {
            white-space: nowrap;
            font-size: clamp(2.5em, 14vw, 4.5em);
        }

        .notfound-text {
            max-width: 26em;
            margin: 18px auto 0;
            color: #666;
        }

        html[data-theme="dark"] .notfound-text {
            color: var(--dark-text-muted);
        }

        @media (prefers-color-scheme: dark) {
            html:not([data-theme="light"]) .notfound-text {
                color: var(--dark-text-muted);
            }
        }
    </style>

    <script src="/js/scripts.js" defer></script>
    <script src="https://kit.fontawesome.com/4dd5c549ad.js" crossorigin="anonymous"></script>
</head>

<body>

    <main class="page-wrapper">
        <div class="profile-section">
            <p class="profile-name" id="notfound-greeting">lost?</p>
            <!-- Runs inline so the swap happens before first paint. A new line per
                 visit, but one picked in the last COOLDOWN is kept, so mashing
                 reload doesn't flick through them. -->
            <script>
                (function () {
                    const MESSAGES = [
                        'lost?', 'oops.', 'uh-oh.', 'whoops!', 'hmm…', 'wrong turn?', 'nope.',
                        'oh no.', 'huh?', 'not here.', 'well…', 'gone!',
                        'missing.', 'oh well.', 'uh…', 'nothing.', 'empty.', 'poof!'
                    ];
                    const KEY = 'notfound-greeting';
                    const COOLDOWN = 30 * 1000;
                    const el = document.getElementById('notfound-greeting');
                    const now = Date.now();

                    let last = null;
                    try { last = JSON.parse(localStorage.getItem(KEY)); } catch { }
                    if (last && MESSAGES.includes(last.text) && now - last.time < COOLDOWN) {
                        el.textContent = last.text;
                        return;
                    }

                    // Never the same one twice in a row.
                    const pool = MESSAGES.filter(m => !last || m !== last.text);
                    const text = pool[Math.floor(Math.random() * pool.length)];
                    el.textContent = text;
                    try { localStorage.setItem(KEY, JSON.stringify({ text, time: now })); } catch { }
                })();
            </script>
            <h1 class="profile-subtitle">404 · Page not found</h1>
            <p class="notfound-text">There's nothing at this address. The page may have moved, or the link may
                have a typo.</p>
        </div>

        <div class="button-groups">
            <div class="button-group">
                <a href="/">
                    <div class="group-btn"><i class="fa-solid fa-house"></i> Home</div>
                </a>
                <a href="/teaching/">
                    <div class="group-btn"><i class="fa-solid fa-chalkboard-teacher"></i> Teaching</div>
                </a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-tools">
            <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Theme: Auto" title="Theme: Auto">
                <i class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i>
            </button>
        </div>
        <p class="copyright"><i class="fa-regular fa-copyright"></i> <span id="copyright-years"
                data-start="2026">2026</span> Eriselda Goga. All Rights Reserved.</p>
    </footer>
</body>

</html>
