<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Syllabase</title>
  <meta name="description" content="Course materials, syllabi and teaching resources.">
  <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
  <link rel="shortcut icon" href="/favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
  <link rel="manifest" href="/favicon/site.webmanifest" />
  <!-- Keep the initial background in sync with the course page before it loads. -->
  <style id="teaching-startup-theme">
    html {
      color-scheme: light;
      background: var(--teaching-start-light, #fff);
      color: #333;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      background: #000;
      color: #e0e0e0;
    }

    @media (prefers-color-scheme: dark) {
      html:not([data-theme="light"]) {
        color-scheme: dark;
        background: #000;
        color: #e0e0e0;
      }
    }

    body {
      margin: 0;
      background: inherit;
    }

    /* Matches the embed's own error screen */
    #teaching-load-error {
      max-width: 40rem;
      margin: 12vh auto;
      padding: 24px;
      font: 16px/1.6 system-ui;
    }
  </style>
  <script>
    (function () {
      let theme = 'auto';
      try { theme = localStorage.getItem('theme-preference') || 'auto'; } catch { }
      if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme;
      const light = new URLSearchParams(location.search).has('admin') ? '#f4f4f4' : '#ffffff';
      document.documentElement.style.setProperty('--teaching-start-light', light);
      const dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.querySelector('meta[name="theme-color"]').content = dark ? '#000000' : light;
    })();
  </script>
  <!-- The embed shows its own error if it loads but can't fetch the courses; the
       fallback below covers the embed script itself failing to load. -->
  <script defer src="https://syllabase.al/embed.js"
    data-teaching-lecturer="6cb0b9e3-986a-40a8-8755-d924ac2bb9e6"
    onerror="document.getElementById('teaching-load-error').hidden = false"></script>
</head>

<body>
  <main id="teaching-load-error" hidden role="alert">
    <h1>Courses unavailable</h1>
    <p>Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <noscript>Please enable JavaScript to view content.</noscript>
</body>

</html>
